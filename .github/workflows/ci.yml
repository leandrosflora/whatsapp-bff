name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # whatsapp-bff.Tests exercises /internal/messages, which resolves IConnectionMultiplexer
    # (StackExchange.Redis) eagerly during ASP.NET Core's minimal-API parameter binding - every
    # request needs a reachable Redis even for tests that only assert validation behavior. The
    # other 4 .NET repos in this org don't have an equivalent eager external dependency.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          # setup-dotnet's cache:true hard-fails ("unable to cache dependencies") when its
          # cache-dependency-path glob (packages.lock.json by default) matches nothing, rather
          # than skipping caching - this repo has no lock files, so caching is left off until
          # one gets added.

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
